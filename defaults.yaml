# foam defaults: the look and the keys of foam's own components:
# ~/.config/sectui/config.yaml.

borderStyle: rounded # single | double | rounded | heavy
nerdFonts: true
emoji: true
roundedBadges: true
spacious: true # An empty line under the top bar and above the help bar.
helpBar: true
transparentBackground: false
mouse: true

# base24 palette.
colors:
  base00: "#1e1e2e"
  base01: "#181825"
  base02: "#313244"
  base03: "#45475a"
  base04: "#585b70"
  base05: "#cdd6f4"
  base06: "#f5e0dc"
  base07: "#b4befe"
  base08: "#f38ba8"
  base09: "#fab387"
  base0A: "#f9e2af"
  base0B: "#a6e3a1"
  base0C: "#94e2d5"
  base0D: "#89b4fa"
  base0E: "#cba6f7"
  base0F: "#f2cdcd"
  base10: "#181825"
  base11: "#11111b"
  base12: "#eba0ac"
  base13: "#f5e0dc"
  base14: "#a6e3a1"
  base15: "#89dceb"
  base16: "#74c7ec"
  base17: "#f5c2e7"

keys:
  list:
    down: [j, down]
    up: [k, up]
    page-down: [ctrl+d, pgdown]
    page-up: [ctrl+u, pgup]
    top: [g, home]
    bottom: [G, end]
  viewer:
    down: [j, down]
    up: [k, up]
    left: [h, left]
    right: [l, right]
    page-down: [pgdown, space]
    page-up: pgup
    half-down: ctrl+d
    half-up: ctrl+u
    top: [g, home]
    bottom: [G, end]
  help:
    close: [esc, "?", q]
    down: [j, down]
    up: [k, up]
    page-down: [pgdown, ctrl+d]
    page-up: [pgup, ctrl+u]
    top: [g, home]
    bottom: [G, end]
  palette:
    close: [esc, ctrl+c]
    run: enter
    up: [up, ctrl+p, ctrl+k]
    down: [down, ctrl+n, ctrl+j]
  confirm:
    yes: y
    no: [n, esc, q, ctrl+c]
    left: [h, left]
    right: [l, right]
    select: enter
  prompt:
    submit: enter
    cancel: [esc, ctrl+c]
  form:
    close: [esc, q, ctrl+c]
    down: [j, down, ctrl+j]
    up: [k, up, ctrl+k]
    top: [g, home]
    bottom: [G, end]
    next: [l, right]
    prev: [h, left]
    edit: enter
    reset: d
  tree:
    open: enter
    expand: [l, right]
    collapse: [h, left]
    expand-all: L
    collapse-all: H
    filter: /
    clear-filter: ctrl+g
